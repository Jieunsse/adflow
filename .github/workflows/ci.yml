name: CI

# 엔진 이중화(TS·Java)를 상시 부채로 안고 가기로 한 이상, 골든 픽스처가 자동으로 돌지 않으면
# 그 방어는 없는 것과 같다 (설계 §8·ADR-067). 두 test 잡이 같은 픽스처를 각자 읽는다.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 같은 브랜치에 연달아 푸시하면 앞선 실행을 버린다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — tsc · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 워크스페이스라 lockfile 은 루트 하나뿐이다 (단계 7 에서 중첩 lockfile 제거).
      - run: npm ci
        working-directory: .
      - run: npx tsc --noEmit
      # vitest 는 CI 환경변수를 보고 watch 를 끈다.
      - run: npm test
      # lint 는 일부러 안 돌린다 — 디자인 토큰·UX 라이팅은 lint 아닌 컨벤션이고(AGENTS.md),
      # `eslint .` 이 green 인지 확인된 적이 없다. green 을 확인한 뒤 넣는다.

  api:
    name: api — gradlew test (골든 픽스처 · OpenAPI 스냅샷)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # test 는 H2 로 돈다 — Docker 없이 통과해야 한다는 build.gradle.kts 의 전제.
      - run: ./gradlew test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: apps/api/build/reports/tests/test

  integration:
    name: api — integrationTest (Testcontainers Postgres)
    runs-on: ubuntu-latest
    # test 잡과 분리한다. Testcontainers 가 이미지를 받아 오래 걸리고, 여기서 깨져도
    # 단위 테스트·골든 픽스처 신호는 살아 있어야 원인이 구분된다.
    needs: api
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew integrationTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-integration-report
          path: apps/api/build/reports/tests/integrationTest
