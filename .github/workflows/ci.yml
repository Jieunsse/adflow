name: CI

# 엔진 이중화(TS·Java)를 상시 부채로 안고 가기로 한 이상, 골든 픽스처가 자동으로 돌지 않으면
# 그 방어는 없는 것과 같다 (설계 §8·ADR-067). 두 test 잡이 같은 픽스처를 각자 읽는다.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 같은 브랜치에 연달아 푸시하면 앞선 실행을 버린다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — tsc · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec tsc --noEmit
      # vitest 는 CI 환경변수를 보고 watch 를 끈다.
      - run: pnpm test
      # 기존 위반 80건은 eslint-suppressions.json 에 기준선으로 박혀 있다 — 여기서 깨지는 것은
      # **새 위반**이다. 경고 67건은 실패시키지 않는다(--max-warnings 없음).
      - run: pnpm lint
