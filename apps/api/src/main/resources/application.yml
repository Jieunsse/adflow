spring:
  application:
    name: adflow-api
  datasource:
    url: jdbc:postgresql://localhost:5432/adflow
    username: adflow
    password: adflow
  jpa:
    hibernate:
      # 로컬 전용. 배포를 결정하면 Flyway 로 교체해야 한다 (설계 §10 부채).
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          # ddl-auto 실패는 기본값에서 로그만 남기고 넘어간다 — 2026-07-26 에 실제로 물렸다.
          # 기존 행이 있어 `tournaments.version`(@Version) 추가가 거부됐는데 앱은 그냥 떴고,
          # 폴러만 매 틱 "column version does not exist" 로 죽었다. 조용한 고장을 기동 실패로 바꾼다.
          # Flyway 를 도입하면(배포 결정 시점, 설계 §10) ddl-auto 와 함께 이 줄도 사라진다.
          halt_on_error: true
  jackson:
    # TS 의 optional(`field?: T`)과 맞추려면 null 필드는 키 자체가 없어야 한다.
    # 명시적으로 null 을 실어야 하는 필드는 @JsonInclude(ALWAYS) 로 개별 예외 처리한다.
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health, info

app:
  # Next.js 서버만 아는 값. /auth/exchange 호출자를 식별한다. 양방향 내부 호출이 같은 값을 쓴다.
  internal-secret: ${ADFLOW_INTERNAL_SECRET:}
  # Spring → Next 내부 호출 (설계 §6) — 챌린저 카피 생성(Gemini)과 SSE 알림 다리.
  # Meta 역위임은 단계 6 에서 사라졌다. 남은 둘은 각각 프롬프트 단일화·프로세스 메모리 때문이다.
  next-internal-url: ${ADFLOW_NEXT_INTERNAL_URL:http://localhost:3000}
  jwt:
    # HS256 서명키. 32바이트 이상. 실값은 환경변수 ADFLOW_JWT_SECRET 로만 준다.
    secret: ${ADFLOW_JWT_SECRET:}
    # 액세스 토큰 수명. 만료되면 Next.js 가 /auth/refresh 로 재발급받는다.
    ttl: PT1H
    # 무상태 갱신 토큰 수명. 서버가 기억하지 않으므로 개별 회수 수단은 서명키 교체뿐이다.
    refresh-ttl: P30D
  encryption:
    # AES-256 컬럼 암호화 키. 정확히 32바이트. 실값은 환경변수로만.
    # 이 키를 잃으면 저장된 Meta 토큰을 복구할 수 없다 — 재로그인으로 다시 받아야 한다.
    key: ${ADFLOW_ENCRYPTION_KEY:}
  poller:
    # 운영 기본값 6시간. 로컬 프로필에서 짧게 덮어쓴다 (설계 §6).
    # 개발 머신은 늘 켜져 있지 않아 주기만으로는 검증이 안 된다 — POST /internal/poller/run 을 같이 쓴다.
    interval: PT6H
  storage:
    # 버킷 파일 루트. 로컬은 파일시스템, 배포하면 S3 호환으로 교체 (설계 §5).
    # 레포 밖에 두려면 ADFLOW_STORAGE_ROOT 로 덮어쓴다.
    root: ${ADFLOW_STORAGE_ROOT:./.adflow-files}

---
spring:
  config:
    activate:
      on-profile: local
app:
  poller:
    interval: PT1M
