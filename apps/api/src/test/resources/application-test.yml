spring:
  datasource:
    url: jdbc:h2:mem:adflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  internal-secret: test-internal-secret
  jwt:
    secret: test-secret-key-for-hs256-at-least-32-bytes
    ttl: PT1H
    refresh-ttl: P30D
  encryption:
    key: test-encryption-key-32-bytes-ok!
  storage:
    # 테스트가 레포에 파일을 남기지 않게 build 아래로 뺀다 (gradle clean 이 쓸어간다).
    root: build/test-files
  poller:
    enabled: false
    interval: PT6H
